<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LZW Compression Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c8eff;
      --accent2: #a78bfa;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --text: #e2e8f0;
      --text-muted: #8892b0;
      --code-bg: #13151f;
      --radius: 10px;
      --font-mono: 'JetBrains Mono', 'Fira Mono', 'Cascadia Code', 'Consolas', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    /* Input section */
    .input-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    textarea {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 0.75rem 1rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 90px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-unit {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .arrow {
      font-size: 1.4rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Result sections */
    .result-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .section-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .section-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      flex: 1;
    }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.15rem 0.65rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    /* Code block */
    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--green);
      word-break: break-all;
      line-height: 1.8;
    }

    .code-block.highlight {
      color: var(--accent);
    }

    /* Dictionary table */
    .dict-table-wrapper {
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .dict-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .dict-table thead tr {
      background: var(--surface2);
    }

    .dict-table th {
      padding: 0.6rem 1rem;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .dict-table td {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .dict-table tbody tr:last-child td {
      border-bottom: none;
    }

    .dict-table tbody tr:hover {
      background: var(--surface2);
    }

    .code-cell {
      color: var(--accent2);
      font-weight: 600;
      width: 80px;
    }

    .bytes-cell {
      color: var(--green);
      width: 200px;
    }

    .decode-cell {
      color: var(--text);
    }

    .decoded-string {
      color: var(--yellow);
    }

    .non-utf8 {
      color: var(--text-muted);
      font-style: italic;
    }

    .empty-dict {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .stats-bar { gap: 0.5rem; }
      .stat-value { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
    Elm.Main.init({ node: document.getElementById('app') });
  </script>
</body>
</html>
